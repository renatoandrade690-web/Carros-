<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Road Rush</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
body{background:#111;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
#menu{position:fixed;inset:0;background:radial-gradient(circle at center,#263238 0%,#080808 75%);display:flex;align-items:center;justify-content:center;z-index:100}
.menu-box{width:min(92%,420px);padding:35px 25px;text-align:center;background:rgba(15,15,15,.92);border:2px solid #333;border-radius:24px;box-shadow:0 0 40px rgba(0,0,0,.7)}
.logo{font-size:48px;font-weight:900;color:#ff3d00;text-shadow:0 5px 0 #8e2100;margin-bottom:5px}.subtitle{color:#aaa;margin-bottom:30px}
.menu-stats{display:flex;justify-content:space-around;margin-bottom:25px}.stat{font-size:18px}.gold{color:#ffd740}
button{border:none;cursor:pointer;font-weight:bold}.main-btn{width:100%;padding:16px;margin-top:12px;border-radius:14px;font-size:18px;color:#fff;background:linear-gradient(135deg,#ff3d00,#ff6d00);box-shadow:0 5px 0 #9e2600}.main-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #9e2600}.secondary-btn{background:#252525;box-shadow:0 4px 0 #111}
#game{display:none;position:fixed;inset:0;background:#111}
#hud{position:absolute;top:0;left:0;width:100%;z-index:20;padding:12px;display:flex;justify-content:space-between;pointer-events:none}.hud-box{background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.1);padding:8px 13px;border-radius:12px;font-size:14px}
#road{position:absolute;left:50%;transform:translateX(-50%);width:min(95vw,480px);height:100vh;overflow:hidden;background:repeating-linear-gradient(to bottom,#303030 0px,#303030 70px,#383838 70px,#383838 140px);border-left:10px solid #e53935;border-right:10px solid #e53935}
.lane-line{position:absolute;width:8px;height:70px;background:#eee;left:33.33%;transform:translateX(-50%);opacity:.85}.lane-line.right{left:66.66%}
#player{position:absolute;width:62px;height:105px;bottom:100px;left:50%;transform:translateX(-50%);border-radius:15px 15px 10px 10px;z-index:10;transition:left .08s linear}
.car-body{width:100%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#b71c1c,#f44336,#b71c1c);border:3px solid #111;box-shadow:0 5px 10px rgba(0,0,0,.5);position:relative}
.window{position:absolute;width:70%;height:30%;left:15%;top:13%;background:linear-gradient(135deg,#90caf9,#263238);border-radius:8px;border:2px solid #111}.hood{position:absolute;width:70%;height:22%;left:15%;bottom:12%;background:rgba(0,0,0,.2);border-radius:8px}
.wheel{position:absolute;width:11px;height:28px;background:#050505;border-radius:5px;top:20%}.wheel.left{left:-8px}.wheel.right{right:-8px}.wheel.back{top:65%}
.enemy{position:absolute;width:62px;height:105px;border-radius:15px 15px 10px 10px;background:linear-gradient(90deg,#1565c0,#42a5f5,#1565c0);border:3px solid #111;z-index:9;box-shadow:0 5px 10px rgba(0,0,0,.5)}
.enemy::before{content:"";position:absolute;width:70%;height:30%;left:15%;top:13%;background:#263238;border-radius:8px;border:2px solid #111}
#controls{position:absolute;bottom:20px;width:100%;display:flex;justify-content:center;gap:30px;z-index:30}.control{width:75px;height:75px;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;border:2px solid #777;font-size:32px}.control:active{background:#ff3d00}
#gameover{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.82);align-items:center;justify-content:center}.gameover-box{width:min(90%,400px);background:#151515;padding:30px;border-radius:22px;text-align:center;border:1px solid #444}.gameover-box h2{font-size:38px;color:#ff3d00;margin-bottom:20px}.result{display:flex;justify-content:space-around;margin:20px 0}.result div{font-size:18px}
#shop{display:none;position:fixed;inset:0;z-index:150;background:#101010;overflow-y:auto;padding:20px}.shop-header{max-width:900px;margin:auto;display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}.shop-header h2{font-size:32px}.shop-gold{color:#ffd740;font-size:20px}.cars{max-width:900px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px}.car-card{background:#1c1c1c;border:1px solid #333;border-radius:18px;padding:20px;text-align:center}.preview{height:120px;display:flex;justify-content:center;align-items:center}.preview-car{width:55px;height:95px;border-radius:14px;border:3px solid #111}.car-name{margin:10px 0;font-weight:bold}.price{color:#ffd740;margin-bottom:10px}.car-card button{width:100%;padding:10px;border-radius:10px;background:#ff3d00;color:#fff}.car-card button:disabled{background:#444;color:#aaa}
@media(max-width:500px){.logo{font-size:40px}#road{width:100vw;border-width:7px}#player,.enemy{width:55px;height:95px}.control{width:70px;height:70px}}
</style>
</head>
<body>
<div id="menu"><div class="menu-box"><div class="logo">ROAD RUSH</div><div class="subtitle">Desvie dos carros e sobreviva!</div><div class="menu-stats"><div class="stat">🪙 <span id="menuGold">0</span></div><div class="stat">🏆 <span id="bestScore">0</span></div></div><button class="main-btn" onclick="startGame()">▶ JOGAR</button><button class="main-btn secondary-btn" onclick="openShop()">🛒 LOJA DE CARRINHOS</button></div></div>
<div id="game"><div id="hud"><div class="hud-box">🏆 <span id="score">0</span></div><div class="hud-box">🏁 Fase <span id="level">1</span></div><div class="hud-box">🪙 <span id="gold">0</span></div></div><div id="road"><div class="lane-line" id="line1"></div><div class="lane-line right" id="line2"></div><div id="player"><div class="car-body"><div class="wheel left"></div><div class="wheel right"></div><div class="wheel left back"></div><div class="wheel right back"></div><div class="window"></div><div class="hood"></div></div></div></div><div id="controls"><button class="control" id="leftBtn">◀</button><button class="control" id="rightBtn">▶</button></div></div>
<div id="gameover"><div class="gameover-box"><h2>GAME OVER</h2><div class="result"><div>🏆<br><span id="finalScore">0</span></div><div>🪙<br><span id="finalGold">0</span></div><div>🏁<br><span id="finalLevel">1</span></div></div><button class="main-btn" onclick="restartGame()">🔄 JOGAR NOVAMENTE</button><button class="main-btn secondary-btn" onclick="goMenu()">🏠 MENU</button></div></div>
<div id="shop"><div class="shop-header"><h2>🛒 Garagem</h2><div class="shop-gold">🪙 <span id="shopGold">0</span></div></div><div class="cars" id="cars"></div><div style="max-width:900px;margin:25px auto"><button class="main-btn secondary-btn" onclick="closeShop()">← VOLTAR</button></div></div>
<script>
const cars=[
{id:0,name:"Carro Vermelho",price:0,color1:"#b71c1c",color2:"#f44336"},
{id:1,name:"Carro Azul",price:100,color1:"#0d47a1",color2:"#2196f3"},
{id:2,name:"Carro Verde",price:250,color1:"#1b5e20",color2:"#4caf50"},
{id:3,name:"Carro Roxo",price:500,color1:"#4a148c",color2:"#9c27b0"},
{id:4,name:"Carro Dourado",price:1000,color1:"#ff8f00",color2:"#ffd740"},
{id:5,name:"Carro Neon",price:2000,color1:"#00acc1",color2:"#00e5ff"}];
let gold=Number(localStorage.getItem("roadGold"))||0,bestScore=Number(localStorage.getItem("roadBest"))||0,unlocked=JSON.parse(localStorage.getItem("roadCars")||"[0]"),selectedCar=Number(localStorage.getItem("roadSelected"))||0,score=0,level=1,gameRunning=false,playerLane=1,enemies=[],gameSpeed=4,spawnTimer=0,animation,lastTime=0;
const menu=document.getElementById("menu"),game=document.getElementById("game"),shop=document.getElementById("shop"),road=document.getElementById("road"),player=document.getElementById("player"),gameover=document.getElementById("gameover");
function saveData(){localStorage.setItem("roadGold",gold);localStorage.setItem("roadBest",bestScore);localStorage.setItem("roadCars",JSON.stringify(unlocked));localStorage.setItem("roadSelected",selectedCar)}
function updateMenu(){document.getElementById("menuGold").textContent=gold;document.getElementById("bestScore").textContent=bestScore} updateMenu();
function startGame(){menu.style.display="none";gameover.style.display="none";game.style.display="block";score=0;level=1;playerLane=1;gameSpeed=4;spawnTimer=0;lastTime=performance.now();enemies.forEach(e=>e.remove());enemies=[];gameRunning=true;applyCar();updatePlayerPosition();updateHUD();animation=requestAnimationFrame(gameLoop)}
function restartGame(){startGame()} function goMenu(){gameover.style.display="none";game.style.display="none";menu.style.display="flex";updateMenu()}
function applyCar(){const car=cars[selectedCar],body=player.querySelector(".car-body");body.style.background=`linear-gradient(90deg,${car.color1},${car.color2},${car.color1})`}
function updateHUD(){document.getElementById("score").textContent=score;document.getElementById("level").textContent=level;document.getElementById("gold").textContent=gold}
function moveLeft(){if(gameRunning&&playerLane>0){playerLane--;updatePlayerPosition()}} function moveRight(){if(gameRunning&&playerLane<2){playerLane++;updatePlayerPosition()}}
function updatePlayerPosition(){player.style.left=["16.66%","50%","83.33%"][playerLane]}
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")moveLeft();if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")moveRight()});
function bindControl(id,fn){const b=document.getElementById(id);b.addEventListener("touchstart",e=>{e.preventDefault();fn()},{passive:false});b.addEventListener("click",fn)} bindControl("leftBtn",moveLeft);bindControl("rightBtn",moveRight);
function spawnEnemy(){const enemy=document.createElement("div");enemy.className="enemy";const lane=Math.floor(Math.random()*3);enemy.dataset.lane=lane;enemy.style.left=["16.66%","50%","83.33%"][lane];enemy.style.transform="translateX(-50%)";enemy.style.top="-130px";road.appendChild(enemy);enemies.push(enemy)}
function collision(a,b){const r1=a.getBoundingClientRect(),r2=b.getBoundingClientRect();return !(r1.bottom<r2.top||r1.top>r2.bottom||r1.right<r2.left||r1.left>r2.right)}
function gameLoop(time){if(!gameRunning)return;const delta=Math.min(50,time-lastTime);lastTime=time;spawnTimer+=delta;const spawnRate=Math.max(350,1000-level*55);if(spawnTimer>=spawnRate){spawnEnemy();spawnTimer=0}
for(let i=enemies.length-1;i>=0;i--){const enemy=enemies[i];let top=parseFloat(enemy.style.top);top+=gameSpeed*(delta/16);enemy.style.top=top+"px";if(collision(player,enemy)){endGame();return}if(top>window.innerHeight+150){enemy.remove();enemies.splice(i,1);score+=10;gold+=1;if(score%100===0){level++;gameSpeed+=.7}updateHUD()}}
document.querySelectorAll(".lane-line").forEach(line=>{let top=parseFloat(line.style.top||"-140");top+=gameSpeed*(delta/16);if(top>window.innerHeight)top=-140;line.style.top=top+"px"});animation=requestAnimationFrame(gameLoop)}
function endGame(){gameRunning=false;cancelAnimationFrame(animation);if(score>bestScore)bestScore=score;saveData();document.getElementById("finalScore").textContent=score;document.getElementById("finalGold").textContent=gold;document.getElementById("finalLevel").textContent=level;gameover.style.display="flex"}
function openShop(){menu.style.display="none";shop.style.display="block";renderShop()} function closeShop(){shop.style.display="none";menu.style.display="flex";updateMenu()}
function renderShop(){document.getElementById("shopGold").textContent=gold;const container=document.getElementById("cars");container.innerHTML="";cars.forEach(car=>{const owned=unlocked.includes(car.id),selected=selectedCar===car.id,card=document.createElement("div");card.className="car-card";card.innerHTML=`<div class="preview"><div class="preview-car" style="background:linear-gradient(90deg,${car.color1},${car.color2},${car.color1})"></div></div><div class="car-name">${car.name}</div>${owned?`<div class="price">${selected?"✓ Equipado":"Desbloqueado"}</div>`:`<div class="price">🪙 ${car.price}</div>`}${selected?`<button disabled>EQUIPADO</button>`:owned?`<button onclick="selectCar(${car.id})">USAR</button>`:`<button onclick="buyCar(${car.id})">COMPRAR</button>`}`;container.appendChild(card)})}
function buyCar(id){const car=cars.find(c=>c.id===id);if(!car)return;if(gold<car.price){alert("Você não tem Gold suficiente!");return}gold-=car.price;unlocked.push(id);selectedCar=id;saveData();renderShop()}
function selectCar(id){if(!unlocked.includes(id))return;selectedCar=id;saveData();renderShop()}
if(!unlocked.includes(0))unlocked.push(0);saveData();
</script>
</body>
</html>
